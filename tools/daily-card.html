<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="오늘 날짜로 뽑는 키워드 카드. 같은 날이면 같은 카드. 스토리용 이미지로 공유하세요.">
  <title>오늘의 카드 | 운세리</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png?v=1">
  <link rel="icon" type="image/png" sizes="16x16" href="../img/favicon-16.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="../img/favicon-180.png?v=1">
  <meta name="theme-color" content="#6b4eff">
  <meta property="og:image" content="https://saju.kaltaelee.com/img/og-image.png">
  <script src="../config.js?v=4.2"></script>
  <script src="../js/solar-terms.js?v=4.2"></script>
  <script src="../js/saju-engine.js?v=4.2"></script>
  <script src="../js/site.js?v=4.3"></script>
  <style>
    :root { --bg:#f3f0ff; --text:#1a1a2e; --muted:#6b7280; --primary:#6b4eff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }
    .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 28px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .hero { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
    .card-face {
      border-radius: 20px; padding: 28px 22px; text-align: center; color: #fff;
      background: linear-gradient(160deg, #4c1d95, #6b4eff 55%, #a855f7);
      box-shadow: 0 14px 36px rgba(76,29,149,.3); margin-bottom: 16px;
      min-height: 280px; display: flex; flex-direction: column; justify-content: center; gap: 10px;
    }
    .card-face .emoji { font-size: 48px; }
    .card-face .kw { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
    .card-face .msg { font-size: 15px; line-height: 1.6; opacity: .95; }
    .card-face .meta { font-size: 12px; opacity: .75; margin-top: 8px; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .actions-full { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .btn {
      padding: 12px; border: none; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer;
      background: #fff; color: var(--primary); box-shadow: 0 4px 16px rgba(107,78,255,.12);
      text-align: center; text-decoration: none; display: block;
    }
    .btn.ghost { background: transparent; box-shadow: none; color: var(--muted); }
    .btn.secondary { background: #ede9fe; color: #5b21b6; box-shadow: none; }
    .toast { text-align: center; font-size: 13px; color: var(--primary); margin-top: 10px; min-height: 20px; }
    .trust { font-size: 11px; color: #5b21b6; text-align: center; margin-top: 14px; font-weight: 600; }
    canvas#share-canvas { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <div id="site-top"></div>
    <h1>🃏 오늘의 카드</h1>
    <p class="hero">오늘 날짜로 뽑는 키워드 한 장 · 같은 날이면 카드가 바뀌지 않아요</p>

    <div class="card-face" id="face">
      <div class="emoji" id="emoji">✨</div>
      <div class="kw" id="kw">—</div>
      <div class="msg" id="msg"></div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="actions">
      <button type="button" class="btn" id="btn-share-img">이미지 저장</button>
      <button type="button" class="btn secondary" id="btn-copy">문구 복사</button>
    </div>
    <div class="actions-full">
      <button type="button" class="btn" id="btn-native-share" style="display:none">친구에게 공유</button>
      <a class="btn ghost" href="today.html">운세도 보기</a>
    </div>
    <div class="toast" id="toast"></div>
    <p class="trust">같은 입력 = 같은 결과 · KARI 절입 만세력</p>
    <canvas id="share-canvas" width="1080" height="1920"></canvas>
  </div>
  <script>
  (function () {
    window.SiteNav.mount('card');
    var SE = window.SajuEngine;
    var today = SE.todayDateStr();
    var day = SE.getDayPillar(today);
    var brand = (window.FORTUNE_CONFIG && window.FORTUNE_CONFIG.brandName) || '운세리';

    var DECK = [
      { emoji: '🌱', kw: '새 시작', msg: '미뤄둔 일을 꺼내기에 좋은 흐름입니다.' },
      { emoji: '🔥', kw: '열정', msg: '에너지가 올라갑니다. 표현을 아끼지 마세요.' },
      { emoji: '🕊️', kw: '휴식', msg: '속도를 낮추고 회복하는 하루가 이득입니다.' },
      { emoji: '💬', kw: '대화', msg: '말 한마디가 관계를 풀어줍니다.' },
      { emoji: '🎯', kw: '집중', msg: '한 가지에만 힘을 모으면 결과가 납니다.' },
      { emoji: '🌊', kw: '유연', msg: '계획을 조금 비틀어도 괜찮아요.' },
      { emoji: '💎', kw: '정리', msg: '버릴 것을 버리면 공간이 생깁니다.' },
      { emoji: '🌈', kw: '기회', msg: '작은 제안도 놓치지 마세요.' },
      { emoji: '🛡️', kw: '경계', msg: '충동적인 결정은 한 템포 늦추세요.' },
      { emoji: '🤝', kw: '연대', msg: '혼자보다 함께일 때 힘이 납니다.' },
      { emoji: '🌙', kw: '직관', msg: '머리보다 느낌이 맞는 날입니다.' },
      { emoji: '☀️', kw: '자신감', msg: '있는 그대로 나서도 충분합니다.' }
    ];

    function hash01(str) {
      var h = 2166136261;
      for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
      return ((h >>> 0) % 10000) / 10000;
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      var words = text.split('');
      var line = '';
      var lines = [];
      for (var n = 0; n < words.length; n++) {
        var test = line + words[n];
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = words[n];
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      var startY = y - ((lines.length - 1) * lineHeight) / 2;
      for (var i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x, startY + i * lineHeight);
      }
    }

    var idx = Math.floor(hash01('card|' + today + '|' + day.pillar) * DECK.length) % DECK.length;
    var c = DECK[idx];
    var dateLabel = today.replace(/-/g, '.');
    var metaLabel = dateLabel + ' · 일주 ' + day.pillar + ' · ' + day.oheng.labelKo;

    document.getElementById('emoji').textContent = c.emoji;
    document.getElementById('kw').textContent = c.kw;
    document.getElementById('msg').textContent = c.msg;
    document.getElementById('meta').textContent = metaLabel;

    var shareText = '🃏 오늘의 카드: ' + c.kw + '\n' + c.msg + '\n' +
      dateLabel + ' · ' + day.pillar + '\nhttps://saju.kaltaelee.com/tools/daily-card.html';

    function drawShareImage() {
      var canvas = document.getElementById('share-canvas');
      var ctx = canvas.getContext('2d');
      var w = canvas.width;
      var h = canvas.height;
      var g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#4c1d95');
      g.addColorStop(0.55, '#6b4eff');
      g.addColorStop(1, '#a855f7');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.beginPath();
      ctx.arc(w * 0.85, h * 0.12, 220, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '700 42px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(brand, w / 2, 180);

      ctx.font = '600 32px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillText('오늘의 카드', w / 2, 240);

      ctx.font = '120px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(c.emoji, w / 2, h * 0.38);

      ctx.font = '900 96px sans-serif';
      ctx.fillText(c.kw, w / 2, h * 0.48);

      ctx.font = '500 44px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      wrapText(ctx, c.msg, w / 2, h * 0.58, w - 160, 64);

      ctx.font = '600 30px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText(metaLabel, w / 2, h * 0.78);

      ctx.font = '600 28px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText('saju.kaltaelee.com', w / 2, h - 120);
      ctx.fillText('같은 날 = 같은 카드', w / 2, h - 70);

      return canvas;
    }

    function toast(msg) {
      document.getElementById('toast').textContent = msg;
    }

    function downloadPng(canvas) {
      var a = document.createElement('a');
      a.download = 'unseri-card-' + today + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      toast('이미지를 저장했어요. 스토리에 올려 보세요!');
    }

    document.getElementById('btn-share-img').addEventListener('click', function () {
      try {
        downloadPng(drawShareImage());
      } catch (e) {
        toast('이미지 만들기에 실패했어요');
      }
    });

    document.getElementById('btn-copy').addEventListener('click', function () {
      navigator.clipboard.writeText(shareText).then(function () {
        toast('복사됐어요!');
      }).catch(function () {
        toast('복사에 실패했어요');
      });
    });

    var nativeBtn = document.getElementById('btn-native-share');
    if (navigator.share) {
      nativeBtn.style.display = 'block';
      nativeBtn.addEventListener('click', function () {
        var canvas = drawShareImage();
        canvas.toBlob(function (blob) {
          if (!blob) {
            navigator.share({ title: brand + ' 오늘의 카드', text: shareText, url: 'https://saju.kaltaelee.com/tools/daily-card.html' });
            return;
          }
          var file = new File([blob], 'unseri-card.png', { type: 'image/png' });
          var data = { title: brand + ' 오늘의 카드', text: shareText, files: [file] };
          if (navigator.canShare && navigator.canShare(data)) {
            navigator.share(data).catch(function () {});
          } else {
            navigator.share({ title: brand + ' 오늘의 카드', text: shareText, url: 'https://saju.kaltaelee.com/tools/daily-card.html' }).catch(function () {});
          }
        }, 'image/png');
      });
    }
  })();
  </script>
</body>
</html>
